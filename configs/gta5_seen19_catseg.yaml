_BASE_: config.yaml
DATASETS:
  TRAIN: ("gta5_train_seg",)
  TEST:  ("acdc_inpaint41_test",)
MODEL:
  META_ARCHITECTURE: "CATSeg"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  SEM_SEG_HEAD:
    NAME: "S2_CorrHead"
    IN_FEATURES: [ "res2", "res3", "res4" ]
    IGNORE_VALUE: 255
    NUM_CLASSES: 19
    TRAIN_CLASS_JSON: "datasets/cityscapes_19.json"
    TEST_CLASS_JSON:  "datasets/inpaint41_vocab.json"
    CLIP_PRETRAINED: "EVA02-CLIP-B-16"
    PROMPT_DEPTH: 0
    PROMPT_LENGTH: 0
    TEXT_GUIDANCE_DIM: 512
    TEXT_GUIDANCE_PROJ_DIM: 128
    APPEARANCE_GUIDANCE_DIM: 512
    APPEARANCE_GUIDANCE_PROJ_DIM: 128
    DECODER_DIMS: [ 64, 32 ]
    DECODER_GUIDANCE_DIMS: [ 256, 128 ]
    DECODER_GUIDANCE_PROJ_DIMS: [ 32, 16 ]
    NUM_LAYERS: 2
    NUM_HEADS: 4
    HIDDEN_DIMS: 128
    POOLING_SIZES: [ 1, 1 ]
    FEATURE_RESOLUTION: [ 32, 32 ]
    GAMMA: [ 0.6, 0.98 ]
    CHUNK_SIZES: 16
    CLIP_FINETUNE: "vision_plus"
    ENABLE_HIGH_RES: "False"
    CACHE_DIR: "EVA02_CLIP_B_psz16_s8B.pt"
  PROMPT_ENSEMBLE_TYPE: "multi_domain"
INPUT:
  MIN_SIZE_TRAIN: (512, 768)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MAX_SIZE_TRAIN: 1024
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 1024
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: (512, 512)
  SIZE_DIVISIBILITY: 32
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "mask_former_semantic"
SOLVER:
  IMS_PER_BATCH: 4
  LR_SCHEDULER_NAME: "WarmupCosineLR"
  BASE_LR: 0.0002
  MAX_ITER: 20000
  BACKBONE_MULTIPLIER: 0.0
  CLIP_MULTIPLIER: 0.01
TEST:
  EVAL_PERIOD: 5000
  SLIDING_WINDOW: True
  SW_KERNEL: 512
  SW_OVERLAP: 0.333
  SW_OUT_RES: [512, 1024]